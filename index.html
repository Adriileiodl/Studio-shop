<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Store</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#232a38;--txt:#e8ecf4;--mut:#8a94a8;--acc:#7c5cff;--ok:#2ecc71}
*{box-sizing:border-box}
html{background:#0b0d12}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.4}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0d12ee}
.logo{font-weight:800;letter-spacing:1px}.logo span{color:var(--acc)}
nav a{color:var(--mut);text-decoration:none;font-size:14px}
.hero{padding:44px 18px 24px;text-align:center;max-width:720px;margin:0 auto}
.tag{color:var(--acc);font-size:12px;letter-spacing:2px;font-weight:700}
.hero h1{font-size:34px;line-height:1.1;margin:10px 0}
.hero p{color:var(--mut);margin:0 0 20px}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:#222a3a}
main{max-width:720px;margin:0 auto;padding:8px 16px 48px}
h2{font-size:22px;margin:24px 0 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 14px;font-size:14px}
.filters button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card small{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:1px}
.card h3{margin:4px 0;font-size:18px}.card p{margin:0 0 12px;color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:700;font-size:18px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}
.box{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px;max-height:90vh;overflow:auto}
input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px;margin:10px 0}
img.qr{width:220px;height:220px;background:#fff;padding:8px;border-radius:10px;display:block;margin:10px auto}
textarea{width:100%;height:70px;background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.c{text-align:center}.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}
</style>
</head>
<body>
<nav><div class="logo">BUILD<span>STORE</span></div><a href="#vitrine">Catálogo</a></nav>
<section class="hero">
  <div class="tag">MARKETPLACE DE BUILDS</div>
  <h1>Construa seu próximo grande jogo.</h1>
  <p>Mapas, cenários e estruturas para acelerar seus projetos no Roblox Studio. Pague no Pix e receba na hora.</p>
  <a class="btn" href="#vitrine">Explorar builds</a>
</section>
<main id="vitrine">
  <h2>Explore as builds</h2>
  <div class="filters" id="filters"></div>
  <div id="list"><p class="mut c">Carregando…</p></div>
</main>
<footer>© Build Store · Arquivos digitais para Roblox Studio</footer>
<div id="sheet"><div class="box" id="box"></div></div>

<script>
// No GitHub Pages, coloque aqui o endereço do seu site no Netlify (sem barra no final).
// Exemplo: 'https://build-store.netlify.app'. Se o site estiver no próprio Netlify, deixe vazio.
const API = '';

const $ = (s) => document.querySelector(s);
const brl = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
let timer, items = [], cat = 'Todos';

fetch(API + '/api/products').then(r => r.json()).then(d => {
  items = d;
  const cats = ['Todos', ...new Set(d.map(p => p.cat).filter(Boolean))];
  $('#filters').innerHTML = cats.map(c => `<button data-c="${c}" class="${c === cat ? 'on' : ''}">${c}</button>`).join('');
  $('#filters').onclick = (e) => { if (e.target.dataset.c) { cat = e.target.dataset.c; show(); } };
  show();
}).catch(() => { $('#list').innerHTML = '<p class="mut c">Não foi possível carregar as builds agora.</p>'; });

function show(){
  document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
  $('#list').innerHTML = items.filter(p => cat === 'Todos' || p.cat === cat).map(p => `
    <div class="card"><small>${(p.cat || '').toUpperCase()}</small><h3>${p.name}</h3><p>${p.desc}</p>
    <div class="row"><span class="price">${brl(p.price)}</span>
    <button onclick="buy('${p.id}','${p.name}')">Comprar</button></div></div>`).join('');
}

function open_(html){ $('#box').innerHTML = html; $('#sheet').classList.add('on'); }
function close_(){ clearInterval(timer); $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') close_(); });

function buy(id, name){
  open_(`<h2>${name}</h2><p class="mut">Informe seu e-mail para receber o comprovante.</p>
    <input id="em" type="email" placeholder="seu@email.com" autocomplete="email">
    <button style="width:100%" onclick="pay('${id}')">Gerar Pix</button>`);
}

async function pay(id){
  const email = $('#em').value.trim();
  if (!email) return;
  open_('<p class="c mut">Gerando Pix…</p>');
  try {
    const r = await fetch(API + '/api/create-pix', { method: 'POST', body: JSON.stringify({ productId: id, email }) });
    const d = await r.json();
    if (!r.ok) throw 0;
    open_(`<h2 class="c">Pague com Pix</h2>
      <img class="qr" src="data:image/png;base64,${d.qr}" alt="QR Code Pix">
      <p class="mut c">Ou copie o código e cole no app do seu banco:</p>
      <textarea id="cd" readonly>${d.code}</textarea>
      <button class="sec" style="width:100%;margin:8px 0" onclick="navigator.clipboard.writeText($('#cd').value);this.textContent='Copiado ✓'">Copiar código Pix</button>
      <p class="mut c" id="st">Aguardando pagamento…</p>`);
    timer = setInterval(() => check(d.id, d.token), 4000);
  } catch { open_('<p class="c">Erro ao gerar o Pix. Tente novamente.</p><button class="sec" style="width:100%" onclick="close_()">Fechar</button>'); }
}

async function check(id, token){
  try {
    const d = await (await fetch(`${API}/api/status?id=${id}&token=${token}`)).json();
    if (d.status === 'approved') {
      clearInterval(timer);
      open_(`<h2 class="c ok">Pagamento aprovado ✓</h2>
        <p class="c mut">${d.name}</p>
        <a class="btn" style="width:100%;text-align:center" href="${d.link}" target="_blank" rel="noopener">Baixar minha build</a>
        <p class="c mut">Salve o link: ele só aparece aqui agora.</p>`);
    } else if (['rejected','cancelled','expired'].includes(d.status)) {
      clearInterval(timer); $('#st').textContent = 'Pagamento não concluído. Feche e tente de novo.';
    }
  } catch {}
}
</script>
</body>
</html>
